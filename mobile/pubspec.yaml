name: sangam_chat
description: "Sangam Avai — Chat Space for Open Sangam literature"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  flutter_markdown: ^0.7.7+2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/poems_registry.json
    - assets/data/texts/
