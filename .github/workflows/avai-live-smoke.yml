name: Avai Live Smoke

# Manual only: this spends real model tokens and needs a working provider key.
# Fast, key-free checks live in ci.yml (avai-tests job).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Provider model id"
        required: true
        default: "google/gemini-2.5-flash"
      backend:
        description: "openrouter or gemini"
        required: true
        default: "openrouter"
        type: choice
        options:
          - openrouter
          - gemini

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agents/avai/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/avai/requirements.txt

      - name: Check provider credential
        id: creds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKEND: ${{ inputs.backend }}
        run: |
          if [ "$BACKEND" = "gemini" ]; then
            if [ -z "$GEMINI_API_KEY" ]; then
              echo "GEMINI_API_KEY not set — skipping live smoke." >> "$GITHUB_STEP_SUMMARY"
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "ready=true" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "OPENROUTER_API_KEY not set — skipping live smoke." >> "$GITHUB_STEP_SUMMARY"
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "ready=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run live smoke
        if: steps.creds.outputs.ready == 'true'
        working-directory: agents
        env:
          SANGAM_AGENT_BACKEND: ${{ inputs.backend }}
          SANGAM_AGENT_MODEL: ${{ inputs.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m avai.evals.qa_smoke
