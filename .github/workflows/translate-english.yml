name: Translate corpus to English

# Phase 2 of the corpus pipeline: nightly batch drafting of the `english` field
# via OpenRouter (Gemini 2.5 Flash). Each run translates a bounded batch from
# the current phase and commits the result, so the corpus fills in over roughly
# a fortnight without anyone driving it.
#
# Requires the repository secret OPENROUTER_API_KEY.
# Runbook: README.md § Python Pipeline.

on:
  schedule:
    # 02:00 UTC nightly.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Verses to translate in this run'
        required: false
        default: '200'
      poem:
        description: 'Restrict to a single poem id (blank = current phase)'
        required: false
        default: ''
      phase:
        description: 'Force a phase number (blank = auto-advance)'
        required: false
        default: ''
      dry_run:
        description: 'Resolve the batch without calling the API or writing files'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Never let one night's run race the next; a long batch should finish first.
concurrency:
  group: translate-english
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for API key
        id: guard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set — skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/python/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: pip install -r backend/python/requirements.txt

      - name: Show current coverage
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend/python
        run: python -m ai.translate_with_gemini --status

      - name: Translate batch
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend/python
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SANGAM_TRANSLATE_BACKEND: openrouter
          SANGAM_TRANSLATE_MODEL: google/gemini-2.5-flash
          SANGAM_RUN_TRIGGER: ${{ github.event_name }}
        run: |
          # Plain if-blocks, not `[ ... ] && ...`: steps run under `bash -e`, so a
          # trailing false test would abort the step rather than skip the flag.
          args=(--lang english --limit "${{ inputs.limit || '200' }}")
          if [ -n "${{ inputs.poem }}" ]; then
            args+=(--poem "${{ inputs.poem }}")
          fi
          if [ -n "${{ inputs.phase }}" ]; then
            args+=(--phase "${{ inputs.phase }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m ai.translate_with_gemini "${args[@]}"

      - name: Summarise run
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend/python
        run: |
          {
            echo '```'
            python -m ai.translate_with_gemini --status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit translations
        if: steps.guard.outputs.configured == 'true' && inputs.dry_run != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/texts data/pipeline

          if git diff --cached --quiet; then
            echo "No new translations — nothing to commit."
            exit 0
          fi

          phase=$(python -c "import json;print(json.load(open('data/pipeline/translation-state.json'))['currentPhase'])")
          verses=$(git diff --cached --name-only -- data/texts | grep -c '/normalized/' || true)

          # [skip ci] keeps the frontend CI/deploy workflows from firing on every
          # nightly data commit; the deploy runs on the next real frontend push.
          git commit -m "chore(data): English drafts — phase ${phase}, ${verses} verses [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
