name: Deploy to Cloudflare Pages (sangam.yazhi.dev)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'data/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_URL: ${{ secrets.VITE_FUNCTIONS_URL }}
        run: npm run build

      - name: Resolve Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          api_token="${CLOUDFLARE_API_TOKEN:-${CLOUDFLARE_TOKEN:-}}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          project_name="open-sangam"

          if [ -z "$api_token" ]; then
            echo "Missing Cloudflare API token. Set one of: CLOUDFLARE_API_TOKEN, CLOUDFLARE_TOKEN" >&2
            exit 1
          fi

          echo "apiToken=$api_token" >> "$GITHUB_OUTPUT"
          echo "accountId=$account_id" >> "$GITHUB_OUTPUT"
          echo "projectName=$project_name" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ steps.cloudflare.outputs.apiToken }}
          accountId: ${{ steps.cloudflare.outputs.accountId }}
          projectName: ${{ steps.cloudflare.outputs.projectName }}
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
